name: Build MindQuest Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate a Flutter-version-matched Android wrapper
        run: |
          cp android/app/google-services.json /tmp/mindquest-google-services.json
          rm -rf android
          flutter create --platforms=android --project-name=mindquest .
          cp /tmp/mindquest-google-services.json android/app/google-services.json
          sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          sed -i '/<application /a\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6509298197152386~4459812651"/>' android/app/src/main/AndroidManifest.xml
      - name: Fetch packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mindquest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
